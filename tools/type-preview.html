<!doctype html><meta charset="utf-8"><title>SEKRET / Spatial Type</title><style>body{background:#09080b;color:#eddde3;font:12px monospace;margin:28px}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}figure{margin:0;border:1px solid #422331;padding:8px}img{width:100%}button{padding:12px;background:#71233f;color:white;border:0}</style><h1>SEKRET / SPATIAL TYPE STUDIES</h1><pre id="result">Compiling new typography…</pre><button id="save">SAVE TYPE THUMBNAIL</button><div id="grid"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {LOOKS,SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';import {download} from '../src/app/utils.js';
let first;const canvas=document.createElement('canvas'),gpu=new AudioGPU(canvas),source=document.createElement('canvas');source.width=1024;source.height=512;let ctx=source.getContext('2d');ctx.fillStyle='white';ctx.font='900 150px Arial';ctx.textAlign='center';ctx.fillText('SEKRET',512,305);gpu.setMedia(source);const results=[];
try{for(let i=0;i<9;i++){gpu.resetFeedback();const scene=SCENE_MAP.get('reactive-typography'),settings=applyLook(scene.id,i);gpu.render({sceneIndex:6,variant:i,params:scene.params.map(p=>settings[p.id].value),signals:[.35,.2,.3,.2,.4,.4,.5,.2],colors:PALETTES[1].stops,colorControls:{},time:6,width:480,height:270});if(gpu.gl.getError())throw Error('GPU error '+i);let data=canvas.toDataURL('image/png');if(i===0)first=data;const fig=document.createElement('figure'),img=new Image(),caption=document.createElement('figcaption');img.src=data;caption.textContent=LOOKS[scene.id][i];fig.append(img,caption);document.querySelector('#grid').append(fig);results.push('PASS '+LOOKS[scene.id][i]);}document.querySelector('#result').textContent=results.join('\n');}catch(e){document.querySelector('#result').textContent=e.stack}finally{gpu.dispose()}
document.querySelector('#save').onclick=()=>download(new Blob([JSON.stringify({type:first})],{type:'application/json'}),'sekret-type-preview.json');
</script>
