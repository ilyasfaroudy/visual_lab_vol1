<!doctype html><meta charset="utf-8"><title>Creative Engine 2.1 — targeted checks</title><style>body{background:#111;color:#eee;font:13px monospace;margin:20px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}canvas{width:100%;height:auto}#hero{height:400px}pre{white-space:pre-wrap}button{padding:10px;background:#492436;color:white;border:1px solid #a76}</style><button id="editor">OPEN ASCII EDITOR</button><div id="editor-root"></div><h1>CREATIVE ENGINE 2.1 / TARGETED PREVIEW</h1><pre id="result">RUNNING</pre><section id="images"></section><button id="hold">HOLD SURFACE CONTACT</button><button id="release">RELEASE</button><button id="theme">LIGHT / DARK</button><div><canvas id="hero"></canvas></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';import {ImageLab} from '../src/image/ImageLab.js';import {Hero} from '../src/home/Hero.js';import {renderAscii} from '../src/image/ascii.js';import {analyzeImage} from '../src/image/analysis.js';import {processEffect} from '../src/image/effects.js';import {SurfaceContactTrail} from '../src/home/SurfaceContactTrail.js';
const checks=[],assert=(v,label)=>{checks.push((v?'PASS ':'FAIL ')+label);if(!v)throw Error(label)};
try{
 const c=document.createElement('canvas');c.width=720;c.height=540;const g=c.getContext('2d');let grd=g.createLinearGradient(0,0,720,540);grd.addColorStop(0,'#040405');grd.addColorStop(1,'#dfb7a8');g.fillStyle=grd;g.fillRect(0,0,720,540);
 grd=g.createRadialGradient(350,200,20,330,260,240);grd.addColorStop(0,'#f4eee2');grd.addColorStop(.5,'#9e7270');grd.addColorStop(1,'#211821');g.fillStyle=grd;g.beginPath();g.ellipse(350,275,155,215,-.18,0,Math.PI*2);g.fill();g.fillStyle='#17141a';for(const x of [285,400]){g.beginPath();g.ellipse(x,240,36,14,.1,0,Math.PI*2);g.fill();}g.lineWidth=8;g.strokeStyle='#35212b';g.beginPath();g.moveTo(340,260);g.lineTo(320,330);g.lineTo(356,335);g.stroke();g.beginPath();g.ellipse(347,380,45,7,.1,0,Math.PI);g.stroke();g.fillStyle='#faf6ed';g.font='bold 50px monospace';g.fillText('СЕКРЕТ / 21',25,65);
 document.querySelector('#editor').onclick=async()=>{const css=document.createElement('link');css.rel='stylesheet';css.href='/src/styles/main.css';document.head.append(css);const root=document.querySelector('#editor-root');root.style.height='850px';const lab=new ImageLab(root,()=>{});await lab.loadFile(new File([await new Promise(r=>c.toBlob(r))],'ascii-study.png',{type:'image/png'}));lab.addEffect('fx15');};
 const source=g.getImageData(0,0,720,540),fx={mode:15,scale:5,amount:1,contrast:1.05,distortion:.65,seed:23,asciiSet:'cyrillic',asciiText:'МАТЕРИЯ / SEKRET',asciiColor:'original'};
 const fidelity=renderAscii(source,fx),experimental=renderAscii(source,{...fx,asciiMode:'experimental'}),again=renderAscii(source,{...fx,asciiMode:'experimental'});
 for(const [name,data] of [['SOURCE',source],['FIDELITY',fidelity],['EXPERIMENTAL',experimental]]){const box=document.createElement('div');box.textContent=name;const canvas=document.createElement('canvas');canvas.width=data.width;canvas.height=data.height;canvas.getContext('2d').putImageData(data,0,0);box.append(canvas);document.querySelector('#images').append(box);}
 assert(experimental.data.every((v,i)=>v===again.data[i]),'deterministic seeded Cyrillic rendering');
 let different=0;for(let i=0;i<fidelity.data.length;i+=4)if(Math.abs(fidelity.data[i]-experimental.data[i])>15)different++;
 assert(different>720*540*.12,'distinct reconstruction and deconstruction algorithms');
 assert(analyzeImage(source)===analyzeImage(source),'analysis identity cache reused');
 const zero=renderAscii(source,{...fx,amount:0});assert(zero.data.every((v,i)=>v===source.data[i]),'zero blend preserves original RGBA');
 const alpha=new ImageData(new Uint8ClampedArray(source.data),720,540);for(let i=3;i<alpha.data.length;i+=4)alpha.data[i]=i%19?128:0;const result=renderAscii(alpha,fx);assert(result.data.every((v,i)=>i%4!==3||v===alpha.data[i]),'original transparency preserved');
 const mosaic=processEffect(source,{mode:32,amount:1,scale:10,contrast:1.2,distortion:.6,seed:23});assert(mosaic.data.length===source.data.length,'adaptive mosaic shares analysis');
 const trail=new SurfaceContactTrail(),settings={recoverySpeed:1.65,revealSpeed:10};let last=0;
 for(let i=0;i<360;i++){trail.update({point:[.4,.2,.13],travel:4},1/60,settings,true);assert(trail.values[3]>=last-1e-7,'contact '+i);last=trail.values[3];}checks.splice(checks.length-360,360,'PASS stationary contact strength never pulses (360 frames)');
 trail.update(null,1/60,settings,true);assert(trail.values[3]>.99,'single-frame hit miss retained');for(let i=0;i<360;i++)trail.update(null,1/60,settings,false);assert(trail.values[3]<.001,'shell recovers after leaving');
 const canvas=document.createElement('canvas'),gpu=new AudioGPU(canvas);for(const id of ['signal-lines','particle-web','ribbon-flow','geometry-field','fluid-blobs','material-resonance']){const scene=SCENE_MAP.get(id),settings=applyLook(id,0),params=new Float32Array(8);scene.params.forEach((p,i)=>params[i]=settings[p.id].value);gpu.render({sceneIndex:scene.index,params,signals:new Float32Array(8),colors:PALETTES[0].stops,colorControls:{},time:4,evolution:[.06,.03,.1,.2],width:320,height:180});const gl=gpu.gl,pixels=new Uint8Array(320*180*4);gl.readPixels(0,0,320,180,gl.RGBA,gl.UNSIGNED_BYTE,pixels);assert(gl.getError()===gl.NO_ERROR,'evolution GPU '+id);assert(pixels.some((v,i)=>i%4!==3&&v>25),'nonempty '+id);}gpu.dispose();
 document.querySelector('#result').textContent=checks.join('\n');
 const hero=new Hero(document.querySelector('#hero'));document.querySelector('#hold').onclick=()=>{hero.pointerInside=true;hero.pointerUV=[.38,.61];hero.target=[.38,.61]};document.querySelector('#release').onclick=()=>{hero.pointerInside=false};document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'};
}catch(error){document.querySelector('#result').textContent=checks.join('\n')+'\nERROR '+error.stack;}
</script>
