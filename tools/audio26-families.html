<!doctype html><meta charset="utf-8"><title>Audio 26 changed systems</title><style>body{min-width:1200px;background:#101014;color:#eee;font:12px monospace}#samples{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}canvas{width:100%}pre{white-space:pre-wrap}</style><pre id="checks">RUNNING</pre><div id="samples"></div><script type="module">
import {asciiAtlas,cityTexture} from '../src/audio/studyAssets.js';
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES,LOOKS} from '../src/audio/scenes.js';
const checks=[],c=document.createElement('canvas');try{const gpu=new AudioGPU(c);for(const id of ['media-reactive','liquid-glass','spectral-bloom','phase-torus','city-signal','tech-radar','neural-core','ascii-motion'])for(let variant=0;variant<LOOKS[id].length;variant++){const scene=SCENE_MAP.get(id),settings=applyLook(id,variant),params=new Float32Array(scene.params.map(p=>settings[p.id].value));gpu.resetFeedback();gpu.resetSpectrum();const media=document.createElement('canvas');media.width=512;media.height=512;const ctx=media.getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,512,512);const gr=ctx.createRadialGradient(240,240,20,256,256,230);gr.addColorStop(0,'#ddd');gr.addColorStop(.45,'#764054');gr.addColorStop(1,'#131b27');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(256,256,220,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.strokeRect(80,120,330,220);gpu.setMedia(id==='city-signal'?cityTexture(null):id==='ascii-motion'?asciiAtlas():media);let first;for(let frame=0;frame<45;frame++){gpu.render({sceneIndex:scene.index,params,signals:new Float32Array([.3+.2*Math.sin(frame*.15),.2,.3,.15,.3,.3,.2,.2]),colors:PALETTES[0].stops,colorControls:{},time:4+frame/30,variant,gradientStyle:variant,camera:[0,0,1,0,0],width:480,height:270});if(frame===0){first=new Uint8Array(480*270*4);gpu.gl.readPixels(0,0,480,270,gpu.gl.RGBA,gpu.gl.UNSIGNED_BYTE,first);}}
const gl=gpu.gl,pixels=new Uint8Array(480*270*4);gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let changed=0,lit=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]>25)lit++;if(Math.abs(first[i]-pixels[i])>5)changed++;}if(gl.getError()!==gl.NO_ERROR||lit<30||changed<30)throw Error(id+'/'+variant+' empty/static '+lit+'/'+changed);gpu.resetFeedback();gpu.render({sceneIndex:scene.index,params,signals:new Float32Array(8),colors:PALETTES[0].stops,colorControls:{},time:4+44/30,variant,gradientStyle:variant,width:480,height:270});const quiet=new Uint8Array(pixels.length);gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,quiet);let audioDifference=0;for(let i=0;i<pixels.length;i+=4)if(Math.abs(quiet[i]-pixels[i])>5)audioDifference++;checks.push('PASS audio response '+variant+' pixels:'+audioDifference);checks.push('PASS '+id+'/'+variant+' lit:'+lit+' moving:'+changed);checks.push('INFO controlled signal input, generated visual fixture; not a real track');const box=document.createElement('div');box.textContent=id+" / "+LOOKS[id][variant];const copy=document.createElement('canvas');copy.width=480;copy.height=270;copy.getContext('2d').drawImage(c,0,0);box.append(copy);document.querySelector('#samples').append(box);}gpu.dispose();}catch(e){checks.push('FAIL '+e.stack)}document.querySelector('#checks').textContent=checks.join('\n');</script>
