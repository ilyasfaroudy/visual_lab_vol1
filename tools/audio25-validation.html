<!doctype html><meta charset="utf-8"><title>Audio 25 output validation</title><style>body{background:#111;color:#ddd;font:13px monospace;min-width:1000px}#images{display:flex;gap:12px}#images canvas{width:480px}pre{white-space:pre-wrap}</style><pre id="checks">RUNNING</pre><div id="images"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';import {LyricsRenderer,lyricsSettings,parseLyrics} from '../src/audio/lyricsMotion.js';
const out=document.querySelector('#checks'),checks=[];const ok=(condition,label)=>{if(!condition)throw Error(label);checks.push('PASS '+label);out.textContent=checks.join('\n')};
const c=document.createElement('canvas'),gpu=new AudioGPU(c),gl=gpu.gl;const args=(id='geometry-field')=>{const scene=SCENE_MAP.get(id),s=applyLook(id,0);return {sceneIndex:scene.index,params:new Float32Array(scene.params.map(p=>s[p.id].value)),signals:new Float32Array([.5,.2,.3,.2,.4,.6,.2,.2]),colors:PALETTES[0].stops,colorControls:{},time:4,width:960,height:540}};
const pixels=()=>{const data=new Uint8Array(c.width*c.height*4);gl.readPixels(0,0,c.width,c.height,gl.RGBA,gl.UNSIGNED_BYTE,data);return data};const copy=()=>{const x=document.createElement('canvas');x.width=c.width;x.height=c.height;x.getContext('2d').drawImage(c,0,0);document.querySelector('#images').append(x);return x};
try{
 for(const [w,h]of [[960,540],[1920,1080]]){gpu.resetFeedback();gpu.render({...args(),width:w,height:h});const p=pixels();ok(gl.getError()===0&&p.some((x,i)=>i%4===0&&x>40),'native render '+w+'×'+h);const preview=copy();const blob=await new Promise(resolve=>preview.toBlob(resolve,'image/png'));const bitmap=await createImageBitmap(blob);ok(bitmap.width===w&&bitmap.height===h,'PNG decoded dimensions '+w+'×'+h);const decoded=document.createElement('canvas');decoded.width=w;decoded.height=h;decoded.getContext('2d').drawImage(bitmap,0,0);const data=decoded.getContext('2d').getImageData(0,0,w,h).data,reference=preview.getContext('2d').getImageData(0,0,w,h).data;ok(data.every((v,i)=>v===reference[i]),'PNG pixel identity '+w+'×'+h);bitmap.close();}
 gpu.resetFeedback();for(let f=0;f<600;f++)gpu.render({...args('feedback-field'),width:240,height:135,time:f/30,dt:1/30,evolution:[.3,0,0,.2]});const p=pixels();let sum=0,xsum=0;for(let y=0;y<135;y++)for(let x=0;x<240;x++){const v=p[(y*240+x)*4];sum+=v;xsum+=x*v;}ok(sum>10000&&Math.abs(xsum/sum/240-.5)<.16,'Feedback centroid after 20 seconds with forced translation');
 gpu.resize(1920,1080);gl.bindFramebuffer(gl.FRAMEBUFFER,gpu.fbos[gpu.index]);const kept=pixels();gl.bindFramebuffer(gl.FRAMEBUFFER,null);ok(gpu.historyValid&&kept.some((x,i)=>i%4===0&&x>20),'Feedback survives resize');
 for(const id of ['particle-web','geometry-field']){gpu.resetFeedback();gpu.render({...args(id),width:480,height:270,camera:[0,0,1,2,0]});ok(!pixels().some((x,i)=>i%4!==3&&x>2),id+' outside UV has no stretched edge');}
 const lr=new LyricsRenderer(),l=lyricsSettings({enabled:true,cues:parseLyrics('[00:00.00]СЕКРЕТ / MOTION\n[00:03.00]ВТОРАЯ СТРОКА')});for(let style=0;style<6;style++){l.style=style;const canvas=lr.render(l,.3,1920,1080,'900 100px Arial',{}, {bass:.4});gpu.setMedia(canvas);gpu.resetFeedback();gpu.render({...args('reactive-typography'),variant:20,width:640,height:360});ok(pixels().some((v,i)=>i%4===0&&v>40),'Lyrics style '+style+' / Cyrillic');if(style===0)copy();}
 gpu.dispose();out.textContent=checks.join('\n')+'\nCOMPLETE';
}catch(e){out.textContent=checks.join('\n')+'\nFAIL '+e.stack;}
</script>
