<!doctype html><meta charset="utf-8"><title>Lyrics controls validation</title><pre id="result">RUNNING</pre><script type="module">
import {LyricsRenderer,lyricsSettings,activeLyric} from '../src/audio/lyricsMotion.js';
const renderer=new LyricsRenderer(),base=lyricsSettings({enabled:true,style:1,cues:[{start:1,end:4,text:'СЕКРЕТ'},{start:4,end:8,text:'ЖИВОЙ СИГНАЛ'}]}),checks=[];
function stats(config,time=2){const canvas=renderer.render(config,time,640,360,'900 100px Arial',{},{}),p=canvas.getContext('2d').getImageData(0,0,640,360).data;let count=0,x=0,y=0,hash=0;for(let i=0;i<p.length;i+=4){const a=p[i+3];hash=(hash*31+a)|0;if(a>30){count++;x+=(i/4)%640;y+=Math.floor(i/4/640);}}return {count,x:x/count,y:y/count,hash};}
try{const normal=stats(base);const x=stats({...base,x:.2}),y=stats({...base,y:.15}),scale=stats({...base,scale:.65}),rotate=stats({...base,rotation:25});if(Math.abs(x.x-normal.x-128)>2||Math.abs(y.y-normal.y-54)>2)throw Error('position');checks.push('PASS Position X/Y / measured centroid');if(scale.count>normal.count*.6||rotate.hash===normal.hash)throw Error('scale/rotation');checks.push('PASS Scale / Rotation');if(stats({...base,overshoot:0},1.12).hash===stats({...base,overshoot:.8},1.12).hash)throw Error('overshoot');checks.push('PASS Overshoot');const saved={...base,x:.2,y:-.1,rotation:23,scale:.7,overshoot:.8};const restored=lyricsSettings(JSON.parse(JSON.stringify(saved)));for(const k of ['x','y','rotation','scale','overshoot'])if(restored[k]!==saved[k])throw Error('restore '+k);checks.push('PASS saved layout settings');if(activeLyric(restored,.9)!==-1||activeLyric(restored,1)!==0||activeLyric(restored,4)!==1||activeLyric(restored,8)!==-1)throw Error('cue boundaries');checks.push('PASS timed cue boundaries');document.querySelector('#result').textContent=checks.join('\n');}catch(e){document.querySelector('#result').textContent=checks.join('\n')+'\nFAIL '+e.stack;}
</script>
