<script>(()=>{'use strict';const config={"type":"liquid-glass","radius":90,"strength":0.7,"smoothing":0.12,"density":70,"color":"#bd5576","text":"UNEXPECTED"},previewConfig=(()=>{let x={};try{x=JSON.parse(new URLSearchParams(location.search).get('settings')||'{}')}catch{}for(const key of ['radius','strength','smoothing','density'])if(Number.isFinite(x[key]))config[key]=x[key];config.radius=Math.max(20,Math.min(200,config.radius));config.strength=Math.max(0,Math.min(2,config.strength));config.smoothing=Math.max(.02,Math.min(.4,config.smoothing));config.density=Math.round(Math.max(12,Math.min(160,config.density)));if(typeof x.text==='string')config.text=x.text.slice(0,40);if(/^#[0-9a-f]{6}$/i.test(x.color))config.color=x.color;return config;})(),root=document.querySelector('.sek-glass'),canvas=root.querySelector('canvas'),gl=canvas.getContext('webgl',{alpha:false,antialias:false}),source=document.createElement('canvas'),ctx=source.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;if(!gl){root.querySelector('.sek-foot').textContent='WebGL is required for refraction';return;}
const vertex='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}',fragment='precision highp float;varying vec2 uv;uniform sampler2D image;uniform vec2 res;uniform vec2 mouse;uniform float radius;uniform float strength;uniform float activity;uniform vec3 tint;void main(){vec2 delta=(uv-mouse)*res/radius;float r=length(delta);float body=1.-smoothstep(.94,1.,r);vec2 normal=delta*sqrt(max(0.,1.-min(1.,r*r)));vec2 offset=normal*radius/res*.32*strength*activity;vec3 color=texture2D(image,uv-offset).rgb;float split=.0015*body*strength*activity;color.r=texture2D(image,uv-offset+vec2(split,0.)).r;color.b=texture2D(image,uv-offset-vec2(split,0.)).b;float rim=exp(-pow((r-.97)/.018,2.))*activity;float highlight=pow(max(0.,dot(normalize(vec3(delta,sqrt(max(.001,1.-r*r)))),normalize(vec3(-.6,.7,1.)))),24.)*body*activity;vec3 glass=color+(tint*.12+vec3(.035))*body*activity+vec3(.8,.85,.9)*rim*.65+vec3(.9)*highlight*.3;gl_FragColor=vec4(mix(texture2D(image,uv).rgb,glass,body+rim*.2),1.);}';

function resize(){const rect=root.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.5);w=rect.width;h=rect.height;canvas.width=source.width=Math.round(w*dpr);canvas.height=source.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const gradient=ctx.createRadialGradient(w*.72,h*.25,0,w*.5,h*.5,w*.8);gradient.addColorStop(0,config.color);gradient.addColorStop(.45,'#22121e');gradient.addColorStop(1,'#08090d');ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;for(let i=-h;i<w+h;i+=32){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-h*.4,h);ctx.stroke();}ctx.font='900 '+Math.max(38,Math.min(150,w*.1))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f5eee9';ctx.fillText(config.text,w/2,h/2,w*.92);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);gl.viewport(0,0,canvas.width,canvas.height);gl.uniform2f(u.res,w,h);gl.uniform1f(u.radius,config.radius);}
const move=e=>{const r=root.getBoundingClientRect();tx=(e.clientX-r.left)/r.width;ty=1-(e.clientY-r.top)/r.height;target=1;},leave=()=>target=0;root.addEventListener('pointermove',move,{passive:true});root.addEventListener('pointerdown',move,{passive:true});root.addEventListener('pointerleave',leave);window.addEventListener('resize',resize);resize();function frame(now){const dt=Math.min(.05,(now-(last||now-16))/1000);last=now;if(!document.hidden){const k=reduced?1:1-Math.exp(-dt/(config.smoothing*2));x+=(tx-x)*k;y+=(ty-y)*k;active+=(target-active)*(1-Math.exp(-dt*9));gl.uniform2f(u.mouse,x,y);gl.uniform1f(u.activity,active);gl.drawArrays(gl.TRIANGLES,0,6);}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);window.addEventListener('pagehide',()=>{cancelAnimationFrame(raf);root.removeEventListener('pointermove',move);root.removeEventListener('pointerdown',move);root.removeEventListener('pointerleave',leave);window.removeEventListener('resize',resize);gl.deleteTexture(texture);gl.deleteBuffer(buffer);gl.deleteProgram(program);},{once:true});})();</script>
