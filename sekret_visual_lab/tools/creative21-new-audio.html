<!doctype html><meta charset="utf-8"><title>New audio shader checks</title><pre id="result">RUNNING</pre><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';
const results=[];try{const c=document.createElement('canvas'),gpu=new AudioGPU(c);for(const id of ['particle-web','voice-sculpture','fluid-blobs']){const scene=SCENE_MAP.get(id),settings=applyLook(id,0),params=new Float32Array(8);scene.params.forEach((p,i)=>params[i]=settings[p.id].value);gpu.render({sceneIndex:scene.index,params,signals:new Float32Array(8),colors:PALETTES[0].stops,colorControls:{},time:4,evolution:[.06,.03,.1,.2],width:320,height:180});const gl=gpu.gl,pixels=new Uint8Array(320*180*4);gl.readPixels(0,0,320,180,gl.RGBA,gl.UNSIGNED_BYTE,pixels);if(gl.getError()!==gl.NO_ERROR||!pixels.some((v,i)=>i%4!==3&&v>25))throw Error(id);results.push('PASS '+id+' / compiled and nonempty');}gpu.dispose()}catch(e){results.push('FAIL '+e.stack)}document.querySelector('#result').textContent=results.join('\n');</script>
