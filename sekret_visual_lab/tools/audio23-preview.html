<!doctype html><meta charset="utf-8"><title>Audio 23 targeted renders</title><style>body{background:#101014;color:#eee;font:12px monospace}#samples{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}canvas{width:100%}pre{white-space:pre-wrap}</style><pre id="checks">RUNNING</pre><div id="samples"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENES,SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';import {asciiAtlas,cityTexture,parseCityGeoJSON} from '../src/audio/studyAssets.js';import {typeTexture} from '../src/audio/typeTexture.js';
const checks=[],c=document.createElement('canvas');try{const gpu=new AudioGPU(c);const cases=[['city-signal',0],['city-signal',1],['tech-radar',0],['neural-core',0],['ascii-motion',0],...SCENES.filter(x=>x.id!=='ribbon-flow'&&SCENE_MAP.get(x.id).index<15).map(s=>[s.id,0])];for(const [id,variant]of cases.filter(([id])=>!location.search.includes('new')||SCENE_MAP.get(id).index>=15)){const scene=SCENE_MAP.get(id),settings=applyLook(id,variant),params=new Float32Array(8);scene.params.forEach((p,i)=>params[i]=settings[p.id].value);gpu.setMedia(id==='city-signal'?cityTexture():id==='ascii-motion'?asciiAtlas():id==='reactive-typography'?typeTexture('SEKRET','900 100px Arial'):null);gpu.resetFeedback();gpu.render({sceneIndex:scene.index,params,signals:new Float32Array([.25,.2,.3,.15,.3,.3,.2,.2]),colors:PALETTES[id==='neural-core'?7:1].stops,colorControls:{},time:4,variant,camera:[0,0,1,0,0],width:640,height:360});const gl=gpu.gl,pixels=new Uint8Array(640*360*4);gl.readPixels(0,0,640,360,gl.RGBA,gl.UNSIGNED_BYTE,pixels);if(gl.getError()!==gl.NO_ERROR||!pixels.some((v,i)=>i%4!==3&&v>25))throw Error(id+' empty/error');checks.push('PASS '+id+' / '+variant);if(scene.index>=15){const box=document.createElement('div');box.textContent=id+' / '+variant;const copy=document.createElement('canvas');copy.width=640;copy.height=360;copy.getContext('2d').drawImage(c,0,0);box.append(copy);document.querySelector('#samples').append(box);}}
const map=parseCityGeoJSON({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:[[37,55],[37.1,55.1]]}},{type:'Feature',properties:{height:50},geometry:{type:'Polygon',coordinates:[[[37,55],[37.05,55],[37.05,55.05],[37,55]]]}}]});if(map.paths.length!==2||!map.paths[1].closed)throw Error('GeoJSON');checks.push('PASS GeoJSON roads / blocks');gpu.dispose();}catch(e){checks.push('FAIL '+e.stack)}document.querySelector('#checks').textContent=checks.join('\n');</script>
