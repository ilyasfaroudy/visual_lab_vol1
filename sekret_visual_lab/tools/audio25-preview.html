<!doctype html><meta charset="utf-8"><title>Audio 25 targeted review</title><style>body{min-width:1200px;background:#101014;color:#eee;font:12px monospace}#samples{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}canvas{width:100%}pre{white-space:pre-wrap}</style><pre id="checks">RUNNING</pre><div id="samples"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES,LOOKS} from '../src/audio/scenes.js';
const checks=[],c=document.createElement('canvas');try{const gpu=new AudioGPU(c);for(const id of ['fluid-blobs'])for(let variant=0;variant<4;variant++){const scene=SCENE_MAP.get(id),settings=applyLook(id,variant),params=new Float32Array(scene.params.map(p=>settings[p.id].value));gpu.resetFeedback();let first;for(let frame=0;frame<45;frame++){gpu.render({sceneIndex:scene.index,params,signals:new Float32Array([.3+.2*Math.sin(frame*.15),.2,.3,.15,.3,.3,.2,.2]),colors:PALETTES[0].stops,colorControls:{},time:4+frame/30,variant,camera:[0,0,1,0,0],width:480,height:270});if(frame===0){first=new Uint8Array(480*270*4);gpu.gl.readPixels(0,0,480,270,gpu.gl.RGBA,gpu.gl.UNSIGNED_BYTE,first);}}
const gl=gpu.gl,pixels=new Uint8Array(480*270*4);gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,pixels);let changed=0,lit=0;for(let i=0;i<pixels.length;i+=4){if(pixels[i]>25)lit++;if(Math.abs(first[i]-pixels[i])>5)changed++;}if(gl.getError()!==gl.NO_ERROR||lit<30||changed<30)throw Error(id+'/'+variant+' empty/static '+lit+'/'+changed);gpu.resetFeedback();gpu.render({sceneIndex:scene.index,params,signals:new Float32Array(8),colors:PALETTES[0].stops,colorControls:{},time:4+44/30,variant,width:480,height:270});const quiet=new Uint8Array(pixels.length);gl.readPixels(0,0,480,270,gl.RGBA,gl.UNSIGNED_BYTE,quiet);let audioDifference=0;for(let i=0;i<pixels.length;i+=4)if(Math.abs(quiet[i]-pixels[i])>5)audioDifference++;if(audioDifference<30)throw Error('No audio response '+variant);checks.push('PASS audio response '+variant+' pixels:'+audioDifference);checks.push('PASS '+id+'/'+variant+' lit:'+lit+' moving:'+changed);const box=document.createElement('div');box.textContent=LOOKS[id][variant];const copy=document.createElement('canvas');copy.width=480;copy.height=270;copy.getContext('2d').drawImage(c,0,0);box.append(copy);document.querySelector('#samples').append(box);}gpu.dispose();}catch(e){checks.push('FAIL '+e.stack)}document.querySelector('#checks').textContent=checks.join('\n');</script>
