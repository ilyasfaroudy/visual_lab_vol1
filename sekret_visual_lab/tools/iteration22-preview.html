<!doctype html><meta charset="utf-8"><title>Iteration 22 targeted checks</title><link rel="stylesheet" href="/src/styles/main.css"><style>body{overflow:auto}#checks{padding:20px;white-space:pre-wrap}#photo{height:800px}#samples{display:flex}#samples canvas{width:33%}</style><pre id="checks">RUNNING</pre><div id="samples"></div><div id="photo"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES} from '../src/audio/scenes.js';import {typeTexture} from '../src/audio/typeTexture.js';import {ImageLab} from '../src/image/ImageLab.js';
const checks=[];try{for(const [id,variant] of [['particle-web',0],['liquid-glass',4],['reactive-typography',12]]){const c=document.createElement('canvas');document.querySelector('#samples').append(c);const gpu=new AudioGPU(c),scene=SCENE_MAP.get(id),settings=applyLook(id,variant),params=new Float32Array(8);scene.params.forEach((p,i)=>params[i]=settings[p.id].value);if(id==='reactive-typography')gpu.setMedia(typeTexture('SEKRET','900 100px Arial'));gpu.render({sceneIndex:scene.index,params,signals:new Float32Array([.4,.2,.3,.1,.4,.5,.3,.2]),colors:PALETTES[0].stops,colorControls:{},time:4,variant,camera:[0,0,1,.08,0],width:640,height:360});const gl=gpu.gl,pixels=new Uint8Array(640*360*4);gl.readPixels(0,0,640,360,gl.RGBA,gl.UNSIGNED_BYTE,pixels);if(gl.getError()!==gl.NO_ERROR||!pixels.some((v,i)=>i%4!==3&&v>25))throw Error(id);checks.push('PASS GPU / '+id);}
 const c=document.createElement('canvas');c.width=600;c.height=400;const g=c.getContext('2d');const gradient=g.createLinearGradient(0,0,600,400);gradient.addColorStop(0,'#121016');gradient.addColorStop(1,'#f4d9ce');g.fillStyle=gradient;g.fillRect(0,0,600,400);g.fillStyle='white';g.font='bold 90px Arial';g.fillText('SEKRET',80,230);const lab=new ImageLab(document.querySelector('#photo'),()=>{});await lab.loadFile(new File([await new Promise(r=>c.toBlob(r))],'ascii-check.png',{type:'image/png'}));checks.push('READY / click ASCII entry');
}catch(e){checks.push('FAIL '+e.stack)}document.querySelector('#checks').textContent=checks.join('\n');</script>
