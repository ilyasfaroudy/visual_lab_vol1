<!doctype html><meta charset="utf-8"><title>Audio 25 inspector</title><link rel="stylesheet" href="../src/styles/main.css"><style>body{min-width:1200px}#lab{height:100vh;min-height:700px}#status{position:fixed;z-index:999;top:0;left:0;background:#000;color:white;font:11px monospace;pointer-events:none}</style><pre id="status">RUNNING</pre><div id="lab"></div><script type="module">
import {AudioLab} from '../src/audio/AudioLab.js';import {SCENES} from '../src/audio/scenes.js';const status=document.querySelector('#status');try{const lab=new AudioLab(document.querySelector('#lab'),()=>{}, {sceneId:'geometry-field',demo:true});let count=0;for(const scene of SCENES){lab.sceneId=scene.id;lab.render();cancelAnimationFrame(lab.raf);if(lab.root.querySelectorAll('[data-value-range]').length!==8||lab.root.querySelectorAll('.focus-section').length!==5||lab.root.querySelectorAll('.input-signal').length!==8)throw Error(scene.id+' inspector');if(scene.id==='city-signal'&&!lab.root.querySelector('#city-import'))throw Error('city control lost');count++;}lab.sceneId='reactive-typography';lab.render();const saved=lab.serialize();lab.mountSaved({...saved,recordSize:'custom',outputCustom:[1600,900],renderResolution:'1080',fluid:{reflection:1.4}});if(lab.outputPixels().join()!=='1600,900'||lab.fluid.reflection!==1.4)throw Error('settings restore');lab.recordSize=1080;lab.renderResolution='auto';lab.render();status.textContent='PASS '+count+' inspectors · parameters / routes retained · output settings restore';}catch(e){status.textContent='FAIL '+e.stack;}
</script>
