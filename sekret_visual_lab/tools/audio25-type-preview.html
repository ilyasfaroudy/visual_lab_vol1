<!doctype html><meta charset="utf-8"><title>Lyrics styles</title><style>body{background:#121216;color:white;font:12px monospace}#images{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%}</style><pre id="status">RUNNING</pre><div id="images"></div><script type="module">
import {AudioGPU} from '../src/audio/gpuEngine.js';import {SCENE_MAP,applyLook,PALETTES,LOOKS} from '../src/audio/scenes.js';import {LyricsRenderer,lyricsSettings,parseLyrics,LYRIC_STYLES} from '../src/audio/lyricsMotion.js';const c=document.createElement('canvas'),gpu=new AudioGPU(c),lr=new LyricsRenderer(),l=lyricsSettings({enabled:true,cues:parseLyrics('[00:00.00]ЖИВОЙ\nСИГНАЛ')});const hashes=new Set(),status=document.querySelector('#status');try{for(let style=0;style<6;style++){l.style=style;gpu.setMedia(lr.render(l,.25,1920,1080,'900 100px Arial',{}, {bass:.4}));gpu.resetFeedback();const scene=SCENE_MAP.get('reactive-typography'),s=applyLook(scene.id,0);gpu.render({sceneIndex:6,variant:20,params:new Float32Array(scene.params.map(p=>s[p.id].value)),signals:new Float32Array(8),colors:PALETTES[0].stops,colorControls:{},time:.25,width:640,height:360});const p=new Uint8Array(640*360*4),gl=gpu.gl;gl.readPixels(0,0,640,360,gl.RGBA,gl.UNSIGNED_BYTE,p);let hash=0;for(let i=0;i<p.length;i+=4)hash=(hash*31+p[i])|0;if(gl.getError()!==0||!p.some((v,i)=>i%4===0&&v>30))throw Error('style '+style);hashes.add(hash);const box=document.createElement('div');box.textContent=LYRIC_STYLES[style];const x=document.createElement('canvas');x.width=640;x.height=360;x.getContext('2d').drawImage(c,0,0);box.append(x);document.querySelector('#images').append(box);}if(hashes.size!==6)throw Error('styles duplicate');status.textContent='PASS / six distinct Cyrillic lyric renders';gpu.dispose();}catch(e){status.textContent='FAIL '+e.stack;}
</script>
